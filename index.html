<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>FusionRL — Interactive Plasma Control</title>

<style>
body {
  margin:0;
  font-family:Arial, sans-serif;
  background:#020617;
  color:#e5e7eb;
}
nav {
  display:flex;
  gap:8px;
  padding:10px;
  border-bottom:1px solid #1e293b;
}
nav button {
  background:#020617;
  color:#e5e7eb;
  border:1px solid #1e293b;
  padding:8px 12px;
  border-radius:8px;
  cursor:pointer;
}
nav button.active {
  background:#1e293b;
}
section {
  display:none;
  padding:20px;
}
section.active {
  display:block;
}
canvas {
  border:1px solid #1e293b;
  border-radius:12px;
}
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
  margin-top:12px;
}
.card {
  border:1px solid #1e293b;
  border-radius:12px;
  padding:12px;
}
.bar {
  height:14px;
  border:1px solid #1e293b;
  border-radius:8px;
  overflow:hidden;
}
.bar div {
  height:100%;
  background:#6366f1;
}
.stat {
  font-size:26px;
  font-weight:bold;
}
</style>
</head>

<body>

<nav>
  <button class="active" onclick="show('sim',this)">1 Simulation</button>
  <button onclick="show('alg',this)">2 Algorithms</button>
  <button onclick="show('xai',this)">3 Explainable AI</button>
  <button onclick="show('human',this)">4 Human vs AI</button>
  <button onclick="show('research',this)">5 Research</button>
</nav>
